name: ${COMPOSE_PROJECT_NAME:-microbind}
x-common: &common
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
x-model: &model
  MICROBIND_DATA: /data
  MICROBIND_DEMO: /app/demo
  MICROBIND_SAMPLES: /app/samples
  MICROBIND_LLM_ENABLED: ${MICROBIND_LLM_ENABLED:-0}
  MICROBIND_LLM_BASE_URL: ${MICROBIND_LLM_BASE_URL:-}
  MICROBIND_LLM_MODEL: ${MICROBIND_LLM_MODEL:-}
  MICROBIND_LLM_API_KEY: ${MICROBIND_LLM_API_KEY:-}
  MICROBIND_LLM_ALLOW_HTTP: ${MICROBIND_LLM_ALLOW_HTTP:-0}
  MICROBIND_SMART_MAX_FINDINGS: ${MICROBIND_SMART_MAX_FINDINGS:-8}
  MICROBIND_JOB_TIMEOUT: ${MICROBIND_JOB_TIMEOUT:-1800}
services:
  api:
    <<: *common
    image: ${API_IMAGE:-microbind-api:0.3.2}
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      <<: *model
      MICROBIND_TOKEN_FILE: /run/secrets/api_token
      MICROBIND_VERIFY_ENABLED: ${MICROBIND_VERIFY_ENABLED:-0}
    secrets: [api_token]
    volumes: [data:/data]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    mem_limit: ${API_MEMORY:-512m}
    cpus: ${API_CPUS:-0.5}
    pids_limit: 96
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    <<: *common
    image: ${API_IMAGE:-microbind-api:0.3.2}
    command: [python, -m, microbind.server.worker]
    environment: *model
    volumes: [data:/data]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: ${WORKER_MEMORY:-1g}
    cpus: ${WORKER_CPUS:-1.0}
    pids_limit: 96
    depends_on:
      api: {condition: service_healthy}
  frontend:
    <<: *common
    image: ${WEB_IMAGE:-microbind-web:0.3.2}
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.28-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18080}:8080"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: ${WEB_MEMORY:-128m}
    cpus: ${WEB_CPUS:-0.25}
    pids_limit: 64
    depends_on:
      api: {condition: service_healthy}
  verifier:
    <<: *common
    profiles: [verify]
    image: ${VERIFY_IMAGE:-microbind-verify:0.3.2}
    build:
      context: .
      dockerfile: deploy/Dockerfile.verifier
      args:
        BACKEND_IMAGE: ${API_IMAGE:-microbind-api:0.3.2}
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        MAVEN_REPOSITORY: ${MAVEN_REPOSITORY:-https://repo.maven.apache.org/maven2}
    environment: *model
    volumes: [data:/data, maven:/cache/maven]
    tmpfs: ["/tmp:size=384m,mode=1777"]
    mem_limit: ${VERIFY_MEMORY:-2g}
    cpus: ${VERIFY_CPUS:-2.0}
    pids_limit: 384
    depends_on:
      api: {condition: service_healthy}
volumes:
  data:
  maven:
secrets:
  api_token:
    file: ./secrets/api_token.txt
