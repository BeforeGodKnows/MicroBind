name: reproducible-demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python -m pip install -r deploy/requirements.lock
      - run: python -m pip install -e '.[server,mcp,test,dev]'
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python -m pytest -q
      - run: python tools/run_paper_samples.py --out out/paper-samples
      - run: python tools/run_runtime_smoke.py --out out/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-and-validation
          path: |
            out/ci/runtime-pipeline.json
            out/ci/repair-plan.json
            out/paper-samples/
