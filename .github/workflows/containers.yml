name: Container acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/init.sh global verify
      - run: bash scripts/deploy.sh online
      - run: docker compose up -d --wait --wait-timeout 180
      - run: bash scripts/container-smoke.sh
      - if: always()
        run: docker compose logs --no-color > container-validation.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-validation
          path: container-validation.log
      - if: always()
        run: docker compose down
