[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microbind-demo"
version = "0.3.4"
description = "Cross-service authorization coverage analysis and repair demonstrator"
requires-python = ">=3.11"
dependencies = ["javalang==0.13.0", "PyYAML==6.0.3", "sqlglot==28.0.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
server = ["fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.32", "httpx==0.28.1"]
mcp = ["mcp==2.3.0"]
dev = ["ruff==0.14.10"]

[project.scripts]
microbind = "microbind.cli:main"
microbind-worker = "microbind.server.worker:main"
microbind-mcp = "microbind.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["samples", "out", "artifacts"]

[tool.ruff.lint]
select = ["F", "I"]
